name: Build Square Jigsaw APK
on:
  push:
    branches: [main, master]
    paths:
      - 'square-jigsaw-android.zip'
      - '.github/workflows/build_square_jigsaw.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Android project
        run: |
          test -f square-jigsaw-android.zip
          mkdir -p android-source
          unzip -q -o square-jigsaw-android.zip -d android-source
          test -f android-source/app/src/main/AndroidManifest.xml
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-source
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Square-Jigsaw-APK
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
