name: Build Square Jigsaw APK
on:
  push:
    branches: [main, master]
    paths:
      - 'square-jigsaw-android.zip'
      - '.github/workflows/build_square_jigsaw.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Android project
        run: |
          test -f square-jigsaw-android.zip
          mkdir -p android-source
          unzip -q -o square-jigsaw-android.zip -d android-source
          test -f android-source/app/src/main/AndroidManifest.xml
      - name: Add fallback Maven repository
        working-directory: android-source
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path('settings.gradle')
          text = path.read_text(encoding='utf-8')
          target = '        mavenCentral()'
          fallback = "        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }"
          if fallback not in text:
              if target not in text:
                  raise RuntimeError('Cannot find Maven Central repository in settings.gradle')
              text = text.replace(target, target + '\n' + fallback)
              path.write_text(text, encoding='utf-8')
          print('Added official Google-hosted Maven Central mirror for Gradle plugin dependencies')
          PYCODE
      - name: Check Kotlin dependency download locations
        shell: bash
        run: |
          for repository in \
            https://repo.maven.apache.org/maven2 \
            https://maven-central.storage-download.googleapis.com/maven2; do
            status=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 15 \
              "$repository/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.20/kotlin-stdlib-jdk8-1.9.20.pom" || true)
            echo "Kotlin 1.9.20 at $repository: HTTP $status"
          done
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-source
        run: gradle assembleDebug --no-daemon --stacktrace --refresh-dependencies
      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Square-Jigsaw-APK
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
